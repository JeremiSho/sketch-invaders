{% extends 'base.html' %}
{% load static %}

{% block content %}
    <div class="level-container">
        <div>
            <h1>Level {{ level.number }}: {{ level.name }}</h1>
        </div>

        <div class="level-subcontainer">
            <div class="game-container">
                <canvas id="game-canvas" data-level="{{ level.number }}" width="800" height="600"></canvas>

                <div id="gameover-overlay" class="gameover-overlay" style="display: none;">
                    <h2 class="gameover-header">GAME OVER</h2>
                    <p class="gameover-text">Final Score: <strong id="final-score">0</strong></p>
                    <div class="gameover-buttons">
                        <button id="btn-restart" class="btn-link">Play Again</button>
                        <a href="{% url 'menu' %}" class="btn-link">Back to Menu</a>
                    </div>
                </div>
            </div>

            <div class="leaderboard-panel">
                <h3 class="list-header">Top 5 (Live)</h3>
                <ul id="top-5-list" class="top-5-list">
                    <li>Waiting for server...</li>
                </ul>
            </div>
        </div>
    </div>

    <script type="module" src="{% static 'js/main.js' %}"></script>
{% endblock %}
